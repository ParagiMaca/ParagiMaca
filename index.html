<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParagiMaca - Katalog Komik Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="viewer-header">
        <div class="header-left">
            <h1 onclick="filterByNav('all', null); navigateTo('catalog')" style="cursor: pointer;">ParagiMaca</h1>
        </div>
        <div class="header-right">
            <button id="back-btn" class="clear-btn" style="display: none;" onclick="handleBackAction()">⬅ Kembali</button>
        </div>
    </header>

    <div id="catalog-page">
        <nav class="category-nav">
            <a href="#" id="nav-all" class="nav-item active" onclick="filterByNav('all', this)">Beranda</a>
            <a href="#" class="nav-item" onclick="filterByNav('Manga', this)">Manga</a>
            <a href="#" class="nav-item" onclick="filterByNav('Manhua', this)">Manhua</a>
            <a href="#" class="nav-item" onclick="filterByNav('Manhwa', this)">Manhwa</a>
        </nav>

        <div class="filter-panel-box">
            <div class="filter-header-title">Komik + Update Terbaru</div>
            
            <div class="filter-grid-inputs">
                <div class="filter-group">
                    <select id="filter-sort">
                        <option value="latest">Chapter Terbaru</option>
                        <option value="title">Abjad (A-Z)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="filter-type">
                        <option value="all">Semua Tipe</option>
                        <option value="Manga">Manga</option>
                        <option value="Manhua">Manhua</option>
                        <option value="Manhwa">Manhwa</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="filter-genre">
                        <option value="all">Semua Genre</option>
                        <option value="Action">Action</option>
                        <option value="Romance">Romance</option>
                        <option value="Urban">Urban</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="filter-status">
                        <option value="all">Semua Status</option>
                        <option value="Ongoing">Ongoing</option>
                        <option value="Tamat">Tamat</option>
                    </select>
                </div>
                <button class="search-apply-btn" onclick="applyAdvancedFilters()">Cari</button>
            </div>
        </div>

        <main class="manga-grid-layout" id="manga-container">
            </main>
    </div>

    <div id="detail-page" style="display: none;">
        <div class="detail-container">
            <div class="detail-upper">
                <div class="detail-cover-box">
                    <img id="detail-cover" src="" alt="Manga Cover">
                </div>
                <div class="detail-info">
                    <h2 id="detail-title">Judul Komik</h2>
                    <p class="detail-author">Status: <span class="status-badge" id="detail-status-text">Ongoing</span></p>
                    <div class="detail-genres" id="detail-genres-container"></div>
                    <div class="detail-synopsis">
                        <h3>Sinopsis</h3>
                        <p>Kisah seru petualangan yang tidak boleh Anda lewatkan begitu saja di platform ParagiMaca.</p>
                    </div>
                    <div class="detail-actions">
                        <button class="primary-btn" onclick="startReading(0)">Baca Chapter Pertama</button>
                    </div>
                </div>
            </div>
            <div class="chapter-section">
                <h3>Daftar Chapter</h3>
                <div class="chapter-list" id="chapter-list-container"></div>
            </div>
        </div>
    </div>

    <div id="reader-page" style="display: none;">
        <div class="reader-controls">
            <select id="mode-select" onchange="switchReaderMode(this.value)">
                <option value="webtoon">Webtoon (Scroll)</option>
                <option value="manga">Manga (Per Halaman)</option>
            </select>
            <div id="manga-nav-buttons" style="display: none; gap: 8px; align-items: center;">
                <button class="nav-arrow-btn" onclick="prevPage()">◀ Kiri</button>
                <span id="page-indicator">1 / 1</span>
                <button class="nav-arrow-btn" onclick="nextPage()">Kanan ▶</button>
            </div>
        </div>
        <main id="reader-container"></main>
    </div>

    <script src="apps.js"></script>
</body>
</html>
