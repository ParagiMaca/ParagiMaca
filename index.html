            <div class="upload-section-box">
                <label class="upload-section-title">Panel Kontributor: Tambah / Update Bab Komik</label>
                
                <div class="form-grid-layout" style="margin-bottom: 8px;">
                    <div class="form-input-group">
                        <select id="upload-action-type" onchange="toggleUploadMode(this.value)">
                            <option value="new">Tindakan: Buat Judul Komik Baru</option>
                            <option value="update">Tindakan: Update Chapter Komik Lama</option>
                        </select>
                    </div>
                    <div class="form-input-group" id="existing-manga-wrapper" style="display: none;">
                        <select id="existing-manga-select">
                        </select>
                    </div>
                </div>

                <div class="form-grid-layout" id="meta-manga-fields">
                    <div class="form-input-group">
                        <input type="text" id="manga-title-input" placeholder="Masukkan Judul Komik Baru...">
                    </div>
                    <div class="form-input-group">
                        <select id="manga-type-input">
                            <option value="Manga">Tipe: Manga</option>
                            <option value="Manhua">Tipe: Manhua</option>
                            <option value="Manhwa">Tipe: Manhwa</option>
                            <option value="Doujinshi">Tipe: Doujinshi</option>
                        </select>
                    </div>
                    
                    <div class="form-input-group" style="grid-column: span 1;">
                        <span style="font-size: 0.72rem; color: #a1a1aa; display:block; margin-bottom:4px; font-weight:600;">Pilih Genre (Bisa Centang Banyak):</span>
                        <div id="manga-genre-checkbox-container" style="background: #202024; border: 1px solid #27272a; border-radius: 5px; max-height: 120px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px;">
                            </div>
                    </div>
                </div>

                <div class="form-input-group" id="synopsis-wrapper" style="margin-top: 8px;">
                    <textarea id="manga-synopsis-input" rows="2" placeholder="Tulis ringkasan cerita atau sinopsis komik di sini..."></textarea>
                </div>

                <div class="form-input-group" style="margin-top: 8px; max-width: 300px;">
                    <input type="text" id="chapter-num-input" placeholder="Nomor Chapter Baru (Contoh: 02, 03)">
                </div>

                <div class="upload-files-row" style="margin-top: 10px;">
                    <div class="file-picker-block" id="cover-picker-wrapper">
                        <span>1. Pilih Gambar Cover:</span>
                        <input type="file" id="imgbb-cover-input" accept="image/*">
                    </div>
                    <div class="file-picker-block">
                        <span>2. Gambar Isi Bab (Bisa >50 File):</span>
                        <input type="file" id="imgbb-pages-input" accept="image/*" multiple>
                    </div>
                </div>

                <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <div id="upload-progress-text" style="font-size: 0.78rem; color: #eab308; font-weight: 600;">Status: Siap memproses formulir.</div>
                    <button id="upload-status-btn" style="min-width: 140px;">Terbitkan Update</button>
                </div>
            </div>

        <main class="manga-grid-layout" id="manga-container">
        </main>

    <div id="detail-page" style="display: none;">
        <div class="detail-container">
            <div class="detail-upper">
                <div class="detail-cover-box">
                    <img id="detail-cover" src="" alt="Manga Cover">
                </div>
                <div class="detail-info">
                    <h2 id="detail-title">Judul Komik</h2>
                    <p class="detail-author">Status: <span class="status-badge" id="detail-status-text">Ongoing</span></p>
                    <div class="detail-genres" id="detail-genres-container"></div>
                    <div class="detail-synopsis">
                        <h3>Sinopsis</h3>
                        <p id="detail-synopsis-text">Kisah seru petualangan.</p>
                    </div>
                    <div class="detail-actions">
                        <button class="primary-btn" onclick="readFirstChapter()">Baca Chapter Pertama</button>
                    </div>
                </div>
            </div>
            <div class="chapter-section">
                <h3>Daftar Chapter</h3>
                <div class="chapter-list" id="chapter-list-container"></div>
            </div>
        </div>
    </div>

    <div id="reader-page" style="display: none;">
        <div class="reader-controls">
            <select id="mode-select" onchange="switchReaderMode(this.value)">
                <option value="webtoon">Webtoon (Scroll)</option>
                <option value="manga">Manga (Per Halaman)</option>
            </select>
            <div id="manga-nav-buttons" style="display: none; gap: 8px; align-items: center;">
                <button class="nav-arrow-btn" onclick="prevPage()">◀ Kiri</button>
                <span id="page-indicator">1 / 1</span>
                <button class="nav-arrow-btn" onclick="nextPage()">Kanan ▶</button>
            </div>
        </div>
        <main id="reader-container"></main>
    </div>
